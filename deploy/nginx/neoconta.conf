# ==============================================================================
# NGINX PRODUCTION REVERSE PROXY CONFIGURATION FOR NEOCONTA
# ==============================================================================
# Colocar en: /etc/nginx/sites-available/neoconta.conf
# Enlazar con: ln -s /etc/nginx/sites-available/neoconta.conf /etc/nginx/sites-enabled/
# ==============================================================================

# 1. Redirección HTTP -> HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name neoconta.com.ar www.neoconta.com.ar _;

    # Permitir verificación de Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor Seguro HTTPS
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name neoconta.com.ar www.neoconta.com.ar;

    # Certificados SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/neoconta.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neoconta.com.ar/privkey.pem;

    # Protocolos y Cifrados Seguros
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!CAMELLIA:!AES128;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeceras de Seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Límite de tamaño para importaciones de extractos bancarios y padrones
    client_max_body_size 50M;

    # Proxy a la aplicación Next.js (Puerto 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Microservicio Data Science - Verificación de Estado (Puerto 8000)
    location = /api-ds/health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Aislar endpoints internos del microservicio Data Science
    location /api-ds/ {
        return 404;
    }
}
